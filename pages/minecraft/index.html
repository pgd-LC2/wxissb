<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 风格游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="crosshair">+</div>
        <div id="inventory-bar">
            <div id="inventory-slots"></div>
        </div>
        <div id="pause-screen">
            <h1>游戏暂停</h1>
            <p>点击屏幕继续游戏</p>
            <div class="controls-info">
                <h2>操作说明</h2>
                <ul>
                    <li><strong>W/A/S/D</strong> - 移动</li>
                    <li><strong>鼠标移动</strong> - 控制视角</li>
                    <li><strong>左键</strong> - 破坏方块</li>
                    <li><strong>右键</strong> - 放置方块</li>
                    <li><strong>空格</strong> - 跳跃</li>
                    <li><strong>Shift</strong> - 奔跑</li>
                    <li><strong>数字键 1-9</strong> - 切换方块</li>
                    <li><strong>ESC</strong> - 暂停游戏</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
