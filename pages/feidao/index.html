const lerp = (a, b, t) => a + (b - a) * t;
const angleLerp = (a, b, t) => {
  let d = b - a;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;

const KNIVES_BY_RARITY = {};
KNIFE_TYPES.forEach((k, idx) => {
  k.id = idx;
  if (!KNIVES_BY_RARITY[k.rarity]) KNIVES_BY_RARITY[k.rarity] = [];
  KNIVES_BY_RARITY[k.rarity].push(k);
});

// 根据威胁等级决定掉落稀有度
function rollKnifeByThreat(threat) {
  // threat 1 -> 几乎全common
  // threat 10+ -> 有机会legendary
  const r = Math.random();
  const t = Math.min(threat, 15);
  if (r < 0.0005 + t * 0.0015) return pick(KNIVES_BY_RARITY.legendary);
  if (r < 0.005 + t * 0.008)    return pick(KNIVES_BY_RARITY.epic);
  if (r < 0.03 + t * 0.025)     return pick(KNIVES_BY_RARITY.rare);
  if (r < 0.15 + t * 0.035)     return pick(KNIVES_BY_RARITY.uncommon);
  return pick(KNIVES_BY_RARITY.common);
}

function addKnifeToPlayer(typeId) {
  const type = KNIFE_TYPES[typeId];

  state.player.knives.push(kn);
  state.player.knifeCounts[typeId] = (state.player.knifeCounts[typeId] || 0) + 1;
  redistributeKnives(state.player);
}

// ============================== 飞刀环绕 ==============================
function createOrbitKnife(type, owner) {
  return {
    type,
    owner,
    ringIdx: 0,
    orbitAngle: Math.random() * TAU,
    orbitRadius: 70,
    spinPhase: Math.random() * TAU,
    x: 0, y: 0,
    angle: 0,
    hitCooldowns: new Map(), // enemy -> time
    globalCooldown: 0,
  };
}

// 根据数量分配到rings
function redistributeKnives(owner) {
  const list = owner.knives;
  const n = list.length;
  if (n === 0) return;

  // 动态 ring 配置
  const rings = [];
  let remaining = n;
  let ringIdx = 0;
  while (remaining > 0) {
    const cap = 8 + ringIdx * 5;
    const count = Math.min(remaining, cap);
    rings.push({ count, radius: 60 + ringIdx * 32, startIdx: n - remaining });
    remaining -= count;
    ringIdx++;
  }

  let idx = 0;
  rings.forEach((r, ri) => {
    for (let i = 0; i < r.count; i++) {
      const kn = list[idx++];
      kn.ringIdx = ri;
      kn.orbitRadius = r.radius;
      kn.ringSlot = i;
      kn.ringTotal = r.count;
      kn.ringDir = ri % 2 === 0 ? 1 : -1; // 偶数环顺时针，奇数环逆时针，视觉好看
    }
  });
}

function updateKnife(kn, dt) {
  kn.globalCooldown -= dt;
  // orbit
  const speedMult = kn.type.orbitSpeed;
  kn.orbitAngle += dt * speedMult * kn.ringDir;
  const baseAngle = kn.ringSlot * TAU / kn.ringTotal + kn.orbitAngle;
  kn.x = kn.owner.x + Math.cos(baseAngle) * kn.orbitRadius;
  kn.y = kn.owner.y + Math.sin(baseAngle) * kn.orbitRadius;
  // 刀尖方向：切线方向
  kn.angle = baseAngle + Math.PI / 2 * kn.ringDir;
  // spin around own axis
  kn.spinPhase += dt * kn.type.rotSpeed;

  // trail pieces
  if (kn.type.trail !== 'none' && Math.random() < 0.55) {
    spawnTrailPiece(kn);
  }

  // 清理过时cooldowns
  if (kn.hitCooldowns.size > 0) {
    const toDel = [];
    for (const [target, time] of kn.hitCooldowns.entries()) {
      if (state.gameTime - time > 0.6 || target.dead) toDel.push(target);
    }
    toDel.forEach(t => kn.hitCooldowns.delete(t));
  }
}

// ============================== 飞刀绘制 ==============================
// 核心：根据飞刀type绘制，带spin效果(宽度随spinPhase波动)
function drawKnife(ctx, kn, scale = 1) {
  const t = kn.type;
  ctx.save();
  ctx.translate(kn.x, kn.y);
  ctx.rotate(kn.angle);
  ctx.scale(scale, scale);

  // spin effect - 刀在空中翻转，模拟真实掷刀
  // 水平方向缩放模拟侧面观察时的窄视图
  const spinFactor = Math.abs(Math.cos(kn.spinPhase));
  const bladeThickness = Math.max(0.25, spinFactor);
  const flipSign = Math.sin(kn.spinPhase) >= 0 ? 1 : -1;

  ctx.scale(1, bladeThickness);

  drawKnifeShape(ctx, t, flipSign);

  ctx.restore();
}

// 绘制掉落中的飞刀(缓慢旋转，整体flat)
function drawKnifeLying(ctx, x, y, type, angle, bob) {
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.rotate(angle);
  drawKnifeShape(ctx, type, 1);
  ctx.restore();
}

// 实际绘制形状
function drawKnifeShape(ctx, t, flipSign) {
  const bl = t.bladeLen;
  const bw = t.bladeW;
  // 刀身朝向 +X 方向 (沿着正x画刀尖)
  // 分为: blade(刀刃) + guard(护手) + hilt(柄) + pommel(柄尾)
  // 刀尖在 +bl/2, 柄尾在 -hilt_len - bl/2
  const hiltLen = bl * 0.55;
  const bladeStart = -bl * 0.05;
  const bladeEnd = bl;

  // --- 刀刃 ---
  ctx.lineJoin = 'miter';
  ctx.miterLimit = 4;

  const blade = t.blade;
  ctx.fillStyle = t.bladeColor;
  ctx.strokeStyle = t.edge;
  ctx.lineWidth = 0.8;

  ctx.beginPath();
  if (blade === 'straight') {
    ctx.moveTo(bladeStart, -bw/2);
    ctx.lineTo(bladeEnd - bw*0.6, -bw/2);
    ctx.lineTo(bladeEnd, 0);
    ctx.lineTo(bladeEnd - bw*0.6, bw/2);
    ctx.lineTo(bladeStart, bw/2);
    ctx.closePath();
  } else if (blade === 'broad') {
    ctx.moveTo(bladeStart, -bw/2);
    ctx.lineTo(bladeEnd * 0.6, -bw/2 * 1.1);
    ctx.lineTo(bladeEnd - bw*0.7, -bw/2 * 0.7);
    ctx.lineTo(bladeEnd, 0);
    ctx.lineTo(bladeEnd - bw*0.7, bw/2 * 0.7);
    ctx.lineTo(bladeEnd * 0.6, bw/2 * 1.1);
    ctx.lineTo(bladeStart, bw/2);
    ctx.closePath();
  } else if (blade === 'needle') {
    ctx.moveTo(bladeStart, -bw/2);
    ctx.lineTo(bladeEnd * 0.4, -bw/2 * 0.9);
    ctx.lineTo(bladeEnd, 0);
    ctx.lineTo(bladeEnd * 0.4, bw/2 * 0.9);
    ctx.lineTo(bladeStart, bw/2);
    ctx.closePath();
  } else if (blade === 'tri') {
    ctx.moveTo(bladeStart, -bw/2);
    ctx.lineTo(bladeEnd, 0);
    ctx.lineTo(bladeStart, bw/2);
    ctx.closePath();
  } else if (blade === 'curved') {
    ctx.moveTo(bladeStart, -bw/2);
    ctx.quadraticCurveTo(bladeEnd * 0.5, -bw * 0.85, bladeEnd, -bw * 0.15);
    ctx.lineTo(bladeEnd, bw * 0.1);
    ctx.quadraticCurveTo(bladeEnd * 0.5, bw * 0.3, bladeStart, bw/2);
    ctx.closePath();
  } else if (blade === 'double') {
    ctx.moveTo(bladeStart, 0);
    ctx.lineTo(bladeStart + bl * 0.15, -bw/2);
    ctx.lineTo(bladeEnd - bw*0.6, -bw/2);
    ctx.lineTo(bladeEnd, 0);
    ctx.lineTo(bladeEnd - bw*0.6, bw/2);
    ctx.lineTo(bladeStart + bl * 0.15, bw/2);
    ctx.closePath();
  } else if (blade === 'leaf') {
    ctx.moveTo(bladeStart, 0);
    ctx.quadraticCurveTo(bladeStart + bl*0.2, -bw * 0.7, bladeEnd * 0.55, -bw * 0.7);
    ctx.quadraticCurveTo(bladeEnd * 0.9, -bw * 0.3, bladeEnd, 0);
    ctx.quadraticCurveTo(bladeEnd * 0.9, bw * 0.3, bladeEnd * 0.55, bw * 0.7);
    ctx.quadraticCurveTo(bladeStart + bl*0.2, bw * 0.7, bladeStart, 0);
    ctx.closePath();
  } else if (blade === 'serrated') {
    // straight with sawtooth edge
    ctx.moveTo(bladeStart, -bw/2);
    const teeth = 6;
    for (let i = 0; i <= teeth; i++) {
      const x = bladeStart + (bladeEnd - bladeStart) * (i / teeth);
      const y = -bw/2 + ((i % 2) ? -bw * 0.25 : 0);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(bladeEnd, 0);
    for (let i = teeth; i >= 0; i--) {
      const x = bladeStart + (bladeEnd - bladeStart) * (i / teeth);
      const y = bw/2 + ((i % 2) ? bw * 0.25 : 0);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
  } else if (blade === 'wavy') {
    // flame-like wave
    const waves = 3;
    ctx.moveTo(bladeStart, -bw/2);
    for (let i = 1; i <= waves * 2; i++) {
      const x = bladeStart + (bladeEnd - bladeStart) * (i / (waves*2));
      const y = -bw/2 + (i % 2 ? -bw * 0.35 : bw * 0.15);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(bladeEnd, 0);
    for (let i = waves * 2; i >= 1; i--) {
      const x = bladeStart + (bladeEnd - bladeStart) * (i / (waves*2));
      const y = bw/2 + (i % 2 ? bw * 0.35 : -bw * 0.15);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  ctx.fill();
  ctx.stroke();

  // 刀刃高光
  ctx.fillStyle = t.edge;
  ctx.globalAlpha = 0.6;
  ctx.fillRect(bladeStart, -0.5, bladeEnd - bladeStart - bw*0.4, 0.9);
  ctx.globalAlpha = 1;

  // --- 护手 ---
  ctx.fillStyle = t.guardColor;
  ctx.fillRect(bladeStart - 1.5, -bw/2 - 1.5, 2.5, bw + 3);

  // --- 刀柄 ---
  const hiltX = bladeStart - 1.5 - hiltLen;
  drawHilt(ctx, t, hiltX, hiltLen, bw);
}

function drawHilt(ctx, t, x, len, bw) {
  const hw = Math.max(2.2, bw * 0.55);
  switch (t.hilt) {
    case 'wrapped':
      ctx.fillStyle = t.hiltColor;
      ctx.fillRect(x, -hw/2, len, hw);
      // 缠绳
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 0.6;
      for (let i = 0; i < 6; i++) {
        const lx = x + len * (i+0.5) / 6;
        ctx.beginPath();
        ctx.moveTo(lx, -hw/2);
        ctx.lineTo(lx + hw * 0.4, hw/2);
        ctx.stroke();
      }
      // pommel
      ctx.fillStyle = '#333';
      ctx.fillRect(x - 1.5, -hw/2 - 0.5, 2, hw + 1);
      break;
    case 'gem':
      ctx.fillStyle = t.hiltColor;
      ctx.fillRect(x, -hw/2, len, hw);
      // 宝石
      ctx.fillStyle = t.guardColor;
      ctx.beginPath(); ctx.arc(x + len * 0.3, 0, hw * 0.45, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x + len * 0.7, 0, hw * 0.35, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(x + len * 0.3 - 0.5, -0.5, hw * 0.15, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      // pommel
      ctx.fillStyle = t.guardColor;
      ctx.beginPath(); ctx.arc(x - 1, 0, hw * 0.6, 0, TAU); ctx.fill();
      break;
    case 'bone':
      ctx.fillStyle = t.hiltColor;
      ctx.fillRect(x, -hw/2, len, hw);
      // 骨纹
      ctx.strokeStyle = 'rgba(90,80,60,0.5)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(x + 1, 0); ctx.lineTo(x + len - 1, 0);
      ctx.stroke();
      // 骨节
      ctx.fillStyle = t.hiltColor;
      ctx.beginPath(); ctx.arc(x, 0, hw * 0.65, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x + len, 0, hw * 0.55, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(90,80,60,0.6)';
      ctx.beginPath(); ctx.arc(x, 0, hw * 0.65, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + len, 0, hw * 0.55, 0, TAU); ctx.stroke();
      break;
    case 'metal':
      const grad = ctx.createLinearGradient(0, -hw/2, 0, hw/2);
      grad.addColorStop(0, t.hiltColor);
      grad.addColorStop(0.5, '#eee');
      grad.addColorStop(1, t.hiltColor);
      ctx.fillStyle = grad;
      ctx.fillRect(x, -hw/2, len, hw);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, -hw/2, len, hw);
      ctx.fillStyle = t.hiltColor;
      ctx.beginPath(); ctx.arc(x - 0.5, 0, hw * 0.6, 0, TAU); ctx.fill();
      break;
    case 'wood':
      ctx.fillStyle = t.hiltColor;
      ctx.fillRect(x, -hw/2, len, hw);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 0.4;
      for (let i = 0; i < 3; i++) {
        const ly = -hw/2 + hw * (i+1) / 4;
        ctx.beginPath();
        ctx.moveTo(x, ly);
        ctx.lineTo(x + len, ly + 0.3);
        ctx.stroke();
      }
      ctx.fillStyle = '#2a1810';
      ctx.fillRect(x - 1.2, -hw/2 - 0.3, 1.8, hw + 0.6);
      break;
    case 'skull':
      ctx.fillStyle = t.hiltColor;
      ctx.fillRect(x + hw * 0.8, -hw/2, len - hw * 0.8, hw);
      // 骷髅
      ctx.fillStyle = '#eee4d0';
      ctx.beginPath(); ctx.arc(x, 0, hw * 0.85, 0, TAU); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x - hw * 0.25, -hw * 0.15, hw * 0.15, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x - hw * 0.25, hw * 0.15, hw * 0.15, 0, TAU); ctx.fill();
      break;
    case 'rune':
      ctx.fillStyle = t.hiltColor;
      ctx.fillRect(x, -hw/2, len, hw);
      // 符文发光
      ctx.fillStyle = t.guardColor;
      ctx.shadowColor = t.guardColor;
      ctx.shadowBlur = 4;
      ctx.fillRect(x + len * 0.2, -0.4, 1.2, 0.8);
      ctx.fillRect(x + len * 0.5, -0.6, 0.8, 1.2);
      ctx.fillRect(x + len * 0.75, -0.4, 1.0, 0.8);
      ctx.shadowBlur = 0;
      ctx.fillStyle = t.hiltColor;
      ctx.beginPath(); ctx.arc(x - 0.5, 0, hw * 0.7, 0, TAU); ctx.fill();
      break;
    default:
      ctx.fillStyle = t.hiltColor;
      ctx.fillRect(x, -hw/2, len, hw);
  }
}

// ============================== 飞刀特效 trail ==============================
function spawnTrailPiece(kn) {
  const t = kn.type.trail;
  let color, life, size;
  switch (t) {
    case 'fire':      color = `hsl(${randI(0,40)},100%,${randI(55,70)}%)`; life = 0.4; size = rand(3,5); break;
    case 'ice':       color = `hsl(${randI(180,210)},80%,${randI(70,85)}%)`; life = 0.5; size = rand(2,4); break;
    case 'lightning': color = `hsl(${randI(45,65)},100%,80%)`; life = 0.15; size = rand(2,4); break;
    case 'poison':    color = `hsl(${randI(90,130)},80%,55%)`; life = 0.6; size = rand(3,5); break;
    case 'shadow':    color = `rgba(30,10,50,${rand(0.4,0.8)})`; life = 0.4; size = rand(3,6); break;
    case 'blood':     color = `hsl(${randI(350,10)},90%,${randI(35,50)}%)`; life = 0.35; size = rand(2,4); break;
    case 'holy':      color = `rgba(255,240,180,${rand(0.5,0.9)})`; life = 0.3; size = rand(2,4); break;
    case 'void':      color = `hsl(${randI(270,320)},80%,${randI(40,60)}%)`; life = 0.5; size = rand(3,5); break;
    case 'wind':      color = `rgba(200,240,220,${rand(0.3,0.6)})`; life = 0.3; size = rand(3,6); break;
    default: return;
  }
  state.trailPieces.push({
    x: kn.x, y: kn.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
    life, maxLife: life, size, color, type: t
  });
}

function updateTrailPieces(dt) {
  for (let i = state.trailPieces.length - 1; i >= 0; i--) {
    const p = state.trailPieces[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === 'fire') { p.vy -= 30 * dt; p.size *= (1 - dt * 0.8); }
    else if (p.type === 'ice') { p.vy += 10 * dt; }
    else if (p.type === 'poison') { p.vy -= 5 * dt; }
    if (p.life <= 0) state.trailPieces.splice(i, 1);
  }
}

function drawTrailPieces() {
  state.trailPieces.forEach(p => {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.type === 'lightning') {
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}

// ============================== 敌人 ==============================
function spawnEnemy(isBoss = false) {
  const angle = Math.random() * TAU;
  const dist = rand(500, 700);
  const x = state.player.x + Math.cos(angle) * dist;
  const y = state.player.y + Math.sin(angle) * dist;

  const threat = state.threat;
  const isStrong = !isBoss && Math.random() < clamp(threat * 0.03, 0.05, 0.35);

  let hp, speed, knifeCount, minRarityRoll;
  if (isBoss) {
    hp = 450 + threat * 60;
    speed = 85;
    knifeCount = Math.min(20 + Math.floor(threat * 1.5), 40);
    minRarityRoll = threat;
  } else if (isStrong) {
    hp = 100 + threat * 15;
    speed = rand(110, 140);
    knifeCount = randI(4, 8 + Math.floor(threat / 2));
    minRarityRoll = threat * 0.8;
  } else {
    hp = 35 + threat * 6;
    speed = rand(90, 130);
    knifeCount = randI(1, Math.min(3 + Math.floor(threat / 3), 6));
    minRarityRoll = threat * 0.5;
  }

  const enemy = {
    x, y, vx: 0, vy: 0,
    hp, maxHp: hp, speed,
    radius: isBoss ? 24 : 13,
    bodyScale: isBoss ? 1.8 : 1.0,
    name: genEnemyName(),
    nameColor: isBoss ? '#ff3366' : (isStrong ? '#ff5544' : '#dcdce0'),
    isBoss, isStrong,
    hitFlash: 0,
    knockX: 0, knockY: 0,
    knives: [],
    facing: 0,
    walkPhase: Math.random() * TAU,
    dead: false,
    color: isBoss ? '#5a3838' : (isStrong ? '#705030' : pick(['#6a4a30','#805a3a','#5a6a50','#706050','#7a5a4a'])),
    clothColor: isBoss ? '#2a0a0a' : pick(['#3a3a4a','#4a3a2a','#2a3a3a','#3a2a3a','#2a2a3a']),
    slow: 0,
    burn: 0,
    poison: 0,
    hitTint: 0,
  };
  // 敌人飞刀
  for (let i = 0; i < knifeCount; i++) {
    const type = rollKnifeForEnemy(minRarityRoll);
    enemy.knives.push(createOrbitKnife(type, enemy));
  }
  redistributeKnives(enemy);
  state.enemies.push(enemy);
  return enemy;
}

function rollKnifeForEnemy(threat) {
  const r = Math.random();
  if (r < 0.0008 * threat) return pick(KNIVES_BY_RARITY.legendary);
  if (r < 0.01 * threat) return pick(KNIVES_BY_RARITY.epic);
  if (r < 0.05 * threat) return pick(KNIVES_BY_RARITY.rare);
  if (r < 0.2 + 0.04 * threat) return pick(KNIVES_BY_RARITY.uncommon);
  return pick(KNIVES_BY_RARITY.common);
}

function updateEnemy(e, dt) {
  if (e.dead) return;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.hitTint > 0) e.hitTint -= dt;
  if (e.slow > 0) e.slow -= dt;
  if (e.burn > 0) {
    e.burn -= dt;
    e.hp -= 10 * dt;
    if (Math.random() < dt * 8) {
      spawnParticle(e.x + rand(-8,8), e.y + rand(-8,8), 'fire', 0);
    }
  }
  if (e.poison > 0) {
    e.poison -= dt;
    e.hp -= 6 * dt;
    if (Math.random() < dt * 5) {
      spawnParticle(e.x + rand(-8,8), e.y + rand(-8,8), 'poison', 0);
    }
  }
  if (e.hp <= 0) {
    killEnemy(e);
    return;
  }

  // AI 移动
  const dx = state.player.x - e.x;
  const dy = state.player.y - e.y;
  const d = Math.sqrt(dx*dx + dy*dy) + 0.001;
  const ndx = dx / d, ndy = dy / d;
  // 敌人想保持在玩家飞刀范围稍外、自己飞刀可击中的距离
  const desired = 110 + e.knives.length * 4;
  let moveDir = 1;
  if (d < desired - 30) moveDir = -0.5;
  else if (d < desired + 30) moveDir = 0; // 徘徊
  // 加入一些绕圈
  const perpX = -ndy, perpY = ndx;
  const circle = Math.sin(state.gameTime * 0.6 + e.walkPhase) * 0.6;
  const speedMul = e.slow > 0 ? 0.45 : 1;
  let mx = ndx * moveDir + perpX * circle;
  let my = ndy * moveDir + perpY * circle;
  const mlen = Math.sqrt(mx*mx + my*my) || 1;
  mx /= mlen; my /= mlen;

  e.vx = lerp(e.vx, mx * e.speed * speedMul, 0.12);
  e.vy = lerp(e.vy, my * e.speed * speedMul, 0.12);

  // knockback
  e.x += e.vx * dt + e.knockX * dt;
  e.y += e.vy * dt + e.knockY * dt;
  e.knockX *= 0.85;
  e.knockY *= 0.85;

  e.facing = Math.atan2(ndy, ndx);
  e.walkPhase += dt * 8;

  // update knives
  e.knives.forEach(kn => updateKnife(kn, dt));

  // 敌人飞刀 vs 玩家
  const pl = state.player;
  for (const kn of e.knives) {
    const rr = pl.radius + 5;
    if (kn.globalCooldown > 0) continue;
    if (dist2(kn.x, kn.y, pl.x, pl.y) < rr * rr) {
      // 命中玩家
      if (pl.damageImmune <= 0) {
        damagePlayer(kn.type.damage * 0.4); // 敌人伤害降低
        kn.globalCooldown = 0.35;
      }
    }
  }
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  state.kills++;
  if (e.isBoss) state.bossActive = false;

  // 掉落一部分飞刀
  const dropRatio = e.isBoss ? 0.7 : (e.isStrong ? 0.55 : 0.5);
  const nDrop = Math.max(1, Math.floor(e.knives.length * dropRatio));
  const pool = [...e.knives].sort(() => Math.random() - 0.5);
  for (let i = 0; i < nDrop; i++) {
    if (!pool[i]) break;
    const kn = pool[i];
    spawnPickup(e.x + rand(-30, 30), e.y + rand(-30, 30), kn.type);
  }

  // 爆炸粒子
  for (let i = 0; i < (e.isBoss ? 80 : 25); i++) {
    spawnParticle(e.x, e.y, 'death', rand(0, TAU));
  }
  addShake(e.isBoss ? 20 : 6, e.isBoss ? 0.4 : 0.15);
  hitStop(e.isBoss ? 0.15 : 0.04);

  // 击杀飘字
  state.floatTexts.push({
    x: e.x, y: e.y - 30,
    vy: -35, life: 1.6, maxLife: 1.6,
    text: `击败 ${e.name}`,
    color: e.isBoss ? '#ff5577' : '#ffaa55',
    size: e.isBoss ? 22 : 14,
    bold: true
  });
}

// ============================== 掉落物 ==============================
function spawnPickup(x, y, type) {
  state.pickups.push({
    x, y,
    vx: rand(-40, 40), vy: rand(-40, 40),
    angle: Math.random() * TAU,
    rotSpeed: rand(-1.5, 1.5),
    bobPhase: Math.random() * TAU,
    type,
    life: 30, // 30s后消失
    pickupRadius: 40,
  });
}

function updatePickups(dt) {
  const pl = state.player;
  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const p = state.pickups[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.angle += p.rotSpeed * dt;
    p.bobPhase += dt * 3;

    // 磁吸
    const d2 = dist2(p.x, p.y, pl.x, pl.y);
    if (d2 < p.pickupRadius * p.pickupRadius) {
      const dx = pl.x - p.x, dy = pl.y - p.y;
      const d = Math.sqrt(d2) || 1;
      const pullStrength = 200 + (1 - d/p.pickupRadius) * 500;
      p.vx += dx / d * pullStrength * dt;
      p.vy += dy / d * pullStrength * dt;
    }
    // 拾取
    if (d2 < (pl.radius + 10) * (pl.radius + 10)) {
      onPickup(p);
      state.pickups.splice(i, 1);
      continue;
    }
    if (p.life <= 0) {
      state.pickups.splice(i, 1);
    }
  }
}

function onPickup(p) {
  addKnifeToPlayer(p.type.id);
  const rar = RARITY[p.type.rarity];
  state.floatTexts.push({
    x: state.player.x, y: state.player.y - 40 + rand(-10, 10),
    vy: -25, life: 1.4, maxLife: 1.4,
    text: `+ ${p.type.name}`,
    color: rar.color,
    size: p.type.rarity === 'legendary' ? 22 : (p.type.rarity === 'epic' ? 18 : 14),
    bold: p.type.rarity !== 'common',
    glow: rar.glow
  });
  // 粒子
  for (let i = 0; i < 12; i++) {
    spawnParticle(p.x, p.y, 'pickup', 0, rar.color);
  }
}

function drawPickups() {
  state.pickups.forEach(p => {
    const rar = RARITY[p.type.rarity];
    const bob = Math.sin(p.bobPhase) * 2;
    // 光圈
    if (p.type.rarity !== 'common') {
      const glowR = 20 + (p.type.rarity === 'legendary' ? 18 : p.type.rarity === 'epic' ? 14 : p.type.rarity === 'rare' ? 10 : 6);
      const pulse = 0.7 + 0.3 * Math.sin(state.gameTime * 4 + p.bobPhase);
      const grad = ctx.createRadialGradient(p.x, p.y + bob, 0, p.x, p.y + bob, glowR * pulse);
      grad.addColorStop(0, rar.glow);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y + bob, glowR * pulse, 0, TAU);
      ctx.fill();
    }
    // 刀
    drawKnifeLying(ctx, p.x, p.y, p.type, p.angle, bob);

    // 闪烁提示
    if (p.life < 5 && Math.floor(p.life * 6) % 2) {
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x, p.y + bob, 10, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  });
}

// ============================== 角色(人形)绘制 ==============================
// 共用：绘制俯视角小人
function drawCharacter(ctx, cx, cy, facing, walkPhase, color, clothColor, scale, hitFlash) {
  ctx.save();
  ctx.translate(cx, cy);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 8 * scale, 11 * scale, 4 * scale, 0, 0, TAU);
  ctx.fill();

  ctx.rotate(facing + Math.PI/2);
  ctx.scale(scale, scale);

  const step = Math.sin(walkPhase) * 2.3;

  // 腿
  ctx.fillStyle = '#1a1410';
  ctx.fillRect(-4, 2 + step, 3.2, 7);
  ctx.fillRect(0.8, 2 - step, 3.2, 7);

  // 身体(袍/甲)
  ctx.fillStyle = clothColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 7.5, 9, 0, 0, TAU);
  ctx.fill();
  // 腰带
  ctx.fillStyle = '#2a1810';
  ctx.fillRect(-7, 3, 14, 1.8);
  // 肩甲
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.arc(-6.5, -5, 3, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(6.5, -5, 3, 0, TAU);
  ctx.fill();

  // 头(带阴影)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, -8, 6, 0, TAU);
  ctx.fill();
  // 头发
  ctx.fillStyle = '#1a0f08';
  ctx.beginPath();
  ctx.arc(0, -9, 6, Math.PI, TAU);
  ctx.fill();

  // 面部暗示(朝前上方)
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(-2.5, -7.5, 5, 1.2);

  // 手
  const handOffset = Math.sin(walkPhase) * 1.8;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(-8, 0 - handOffset, 1.8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(8, 0 + handOffset, 1.8, 0, TAU); ctx.fill();

  // 受伤闪红
  if (hitFlash > 0) {
    ctx.globalAlpha = Math.min(hitFlash * 3, 1);
    ctx.fillStyle = '#fff';
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ============================== 粒子 ==============================
function spawnParticle(x, y, type, angleHint, colorOverride) {
  const a = angleHint !== undefined && angleHint !== 0 ? angleHint + rand(-0.6, 0.6) : rand(0, TAU);
  const sp = rand(60, 220);
  let color, life, size, gravity = 0;
  switch (type) {
    case 'hit': color = colorOverride || '#fff4a0'; life = 0.35; size = rand(2,4); break;
    case 'spark': color = colorOverride || `hsl(${randI(20,60)},100%,70%)`; life = 0.5; size = rand(1.5, 3); break;
    case 'death': color = colorOverride || `hsl(${randI(0,40)},80%,${randI(40,60)}%)`; life = rand(0.5, 1.2); size = rand(2, 5); break;
    case 'fire': color = `hsl(${randI(0,40)},100%,${randI(55,75)}%)`; life = 0.6; size = rand(3, 6); gravity = -40; break;
    case 'poison': color = `hsl(${randI(80,120)},70%,55%)`; life = 0.6; size = rand(2, 4); break;
    case 'pickup': color = colorOverride || '#fff'; life = 0.7; size = rand(1.5, 3); break;
    default: color = '#fff'; life = 0.3; size = 2;
  }
  state.particles.push({
    x, y,
    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    life, maxLife: life,
    size, color, gravity
  });
}

function updateParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.vy += p.gravity * dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
}

function drawParticles() {
  state.particles.forEach(p => {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * a), 0, TAU);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ============================== 火花/顿挫 ==============================
function spawnHitSpark(x, y, angle, color) {
  // 星形爆闪
  state.sparks.push({
    x, y, angle, color: color || '#fff6a0',
    life: 0.22, maxLife: 0.22, size: rand(14, 22)
  });
  // 射线粒子
  for (let i = 0; i < 8; i++) {
    const a = angle + rand(-1.2, 1.2);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * rand(120, 300),
      vy: Math.sin(a) * rand(120, 300),
      life: 0.35, maxLife: 0.35,
      size: rand(1.5, 3),
      color: `hsl(${randI(30,55)},100%,${randI(70,90)}%)`,
      gravity: 0
    });
  }
  // 白色闪光粒子
  for (let i = 0; i < 5; i++) {
    spawnParticle(x, y, 'hit', 0);
  }
}

function updateSparks(dt) {
  for (let i = state.sparks.length - 1; i >= 0; i--) {
    const s = state.sparks[i];
    s.life -= dt;
    if (s.life <= 0) state.sparks.splice(i, 1);
  }
}

function drawSparks() {
  state.sparks.forEach(s => {
    const a = s.life / s.maxLife;
    const sz = s.size * (0.6 + a * 1.4);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = 'lighter';
    // 十字亮光
    const g1 = ctx.createLinearGradient(-sz, 0, sz, 0);
    g1.addColorStop(0, 'rgba(255,255,255,0)');
    g1.addColorStop(0.5, s.color);
    g1.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(-sz, -1, sz*2, 2);
    ctx.rotate(Math.PI/2);
    ctx.fillRect(-sz*0.6, -0.8, sz*1.2, 1.6);
    // 中心光点
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, sz*0.6);
    rg.addColorStop(0, '#fff');
    rg.addColorStop(0.4, s.color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(0, 0, sz*0.6, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.restore();
  });
}

// ============================== 爆炸 ==============================
function spawnExplosion(x, y, radius, color) {
  state.explosions.push({ x, y, radius, life: 0.4, maxLife: 0.4, color });
  // 伤害检测
  state.enemies.forEach(e => {
    if (e.dead) return;
    if (dist2(e.x, e.y, x, y) < radius * radius) {
      e.hp -= 30;
      e.hitFlash = 0.2;
      const dx = e.x - x, dy = e.y - y;
      const d = Math.sqrt(dx*dx+dy*dy)||1;
      e.knockX += dx / d * 300;
      e.knockY += dy / d * 300;
    }
  });
  for (let i = 0; i < 30; i++) {
    spawnParticle(x, y, 'fire', 0);
  }
  addShake(10, 0.15);
}

function updateExplosions(dt) {
  for (let i = state.explosions.length - 1; i >= 0; i--) {
    const e = state.explosions[i];
    e.life -= dt;
    if (e.life <= 0) state.explosions.splice(i, 1);
  }
}

function drawExplosions() {
  state.explosions.forEach(e => {
    const a = e.life / e.maxLife;
    const r = e.radius * (1.2 - a * 0.5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
    g.addColorStop(0, 'rgba(255,255,220,' + (a * 0.9) + ')');
    g.addColorStop(0.3, 'rgba(255,140,30,' + (a * 0.8) + ')');
    g.addColorStop(1, 'rgba(120,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  });
}

// ============================== 玩家伤害 ==============================
function damagePlayer(dmg) {
  const pl = state.player;
  if (pl.damageImmune > 0) return;
  pl.hp -= dmg;
  pl.hitFlash = 0.3;
  pl.damageImmune = 0.35;
  addShake(5, 0.12);
  // 受伤粒子
  for (let i = 0; i < 6; i++) spawnParticle(pl.x, pl.y, 'death', 0, '#ff3344');
  if (pl.hp <= 0) {
    pl.hp = 0;
    gameOver();
  }
}

// ============================== 飞刀 vs 敌人 碰撞处理 ==============================
function knifeHitEnemy(kn, e) {
  const t = kn.type;
  let dmg = t.damage;
  // special 处理
  if (t.special === 'pierce') dmg *= 1.2;
  e.hp -= dmg;
  e.hitFlash = 0.22;
  e.hitTint = 0.22;
  // knockback
  const dx = e.x - kn.x, dy = e.y - kn.y;
  const d = Math.sqrt(dx*dx+dy*dy) || 1;
  e.knockX += dx / d * 140;
  e.knockY += dy / d * 140;
  // cooldown per-target
  kn.hitCooldowns.set(e, state.gameTime);
  // 帅炸的火花
  const sparkAngle = Math.atan2(-dy, -dx);
  spawnHitSpark(kn.x, kn.y, sparkAngle, '#fff4a0');
  // trail类颜色的附加粒子
  switch (t.trail) {
    case 'fire': for (let i=0;i<6;i++) spawnParticle(kn.x, kn.y, 'fire', 0); break;
    case 'lightning': for (let i=0;i<8;i++) spawnParticle(kn.x, kn.y, 'spark', 0, '#fff3a0'); break;
    case 'ice': for (let i=0;i<6;i++) spawnParticle(kn.x, kn.y, 'spark', 0, '#aaddff'); break;
    case 'poison': for (let i=0;i<6;i++) spawnParticle(kn.x, kn.y, 'poison', 0); break;
    case 'shadow': for (let i=0;i<6;i++) spawnParticle(kn.x, kn.y, 'spark', 0, '#7744aa'); break;
    case 'blood': for (let i=0;i<6;i++) spawnParticle(kn.x, kn.y, 'spark', 0, '#cc2233'); break;
    case 'void': for (let i=0;i<8;i++) spawnParticle(kn.x, kn.y, 'spark', 0, '#aa44ff'); break;
    case 'holy': for (let i=0;i<6;i++) spawnParticle(kn.x, kn.y, 'spark', 0, '#ffeeaa'); break;
  }
  addShake(2.5, 0.06);
  hitStop(0.015);

  // special effects
  if (t.special === 'explode') {
    spawnExplosion(kn.x, kn.y, 60, '#ff8020');
  } else if (t.special === 'slow') {
    e.slow = Math.max(e.slow, 1.5);
  } else if (t.special === 'burn') {
    e.burn = Math.max(e.burn, 2.0);
  } else if (t.special === 'bleed') {
    e.poison = Math.max(e.poison, 1.5);
  } else if (t.special === 'chain') {
    // 闪电跳到另一个敌人
    chainLightning(e, kn, 2, dmg * 0.6);
  } else if (t.special === 'splash') {
    // 范围伤害
    state.enemies.forEach(other => {
      if (other !== e && !other.dead && dist2(other.x, other.y, e.x, e.y) < 60*60) {
        other.hp -= dmg * 0.5;
        other.hitFlash = 0.18;
      }
    });
    for (let i = 0; i < 12; i++) {
      spawnParticle(kn.x, kn.y, 'spark', 0, t.edge);
    }
  }
}

function chainLightning(fromEnemy, kn, remainingJumps, dmg) {
  if (remainingJumps <= 0) return;
  let best = null, bestD = 180 * 180;
  state.enemies.forEach(o => {
    if (o === fromEnemy || o.dead) return;
    if (o.chainHitTime && state.gameTime - o.chainHitTime < 0.1) return;
    const d2v = dist2(o.x, o.y, fromEnemy.x, fromEnemy.y);
    if (d2v < bestD) { bestD = d2v; best = o; }
  });
  if (!best) return;
  best.hp -= dmg;
  best.hitFlash = 0.2;
  best.chainHitTime = state.gameTime;
  // 闪电线
  state.sparks.push({
    x: fromEnemy.x, y: fromEnemy.y,
    x2: best.x, y2: best.y,
    life: 0.18, maxLife: 0.18,
    isLine: true, color: '#fff6a0'
  });
  for (let i = 0; i < 6; i++) spawnParticle(best.x, best.y, 'spark', 0, '#fff6a0');
  chainLightning(best, kn, remainingJumps - 1, dmg * 0.7);
}

// ============================== 碰撞：玩家飞刀 vs 敌人 ==============================
function processPlayerKnivesHits() {
  const knives = state.player.knives;
  for (const kn of knives) {
    const t = kn.type;
    for (const e of state.enemies) {
      if (e.dead) continue;
      const rr = e.radius + 6;
      if (dist2(kn.x, kn.y, e.x, e.y) < rr * rr) {
        const last = kn.hitCooldowns.get(e) || -99;
        if (state.gameTime - last > 0.35) {
          knifeHitEnemy(kn, e);
        }
      }
    }
  }
}

// ============================== 飘字 ==============================
function updateFloatTexts(dt) {
  for (let i = state.floatTexts.length - 1; i >= 0; i--) {
    const f = state.floatTexts[i];
    f.life -= dt;
    f.y += f.vy * dt;
    f.vy *= 0.96;
    if (f.life <= 0) state.floatTexts.splice(i, 1);
  }
}

function drawFloatTexts() {
  ctx.textAlign = 'center';
  state.floatTexts.forEach(f => {
    const a = clamp(f.life / f.maxLife * 1.2, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `${f.bold ? 'bold ' : ''}${f.size}px 'Microsoft YaHei', sans-serif`;
    if (f.glow) {
      ctx.shadowColor = f.glow;
      ctx.shadowBlur = 12;
    }
    ctx.fillStyle = '#000';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.shadowBlur = 0;
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ============================== 敌人绘制 ==============================
function drawEnemy(e) {
  if (e.dead) return;

  drawCharacter(ctx, e.x, e.y, e.facing, e.walkPhase, e.color, e.clothColor, e.bodyScale, e.hitFlash);

  // 名字
  ctx.textAlign = 'center';
  ctx.font = `${e.isBoss ? 'bold 16px' : (e.isStrong ? 'bold 13px' : '12px')} 'Microsoft YaHei', sans-serif`;
  const ny = e.y - 24 * e.bodyScale;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillText(e.name, e.x + 1, ny + 1);
  ctx.fillStyle = e.nameColor;
  ctx.fillText(e.name, e.x, ny);

  // HP 条
  const bw = e.isBoss ? 80 : 30;
  const bh = e.isBoss ? 7 : 3.5;
  const by = ny + 4;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(e.x - bw/2 - 1, by - 1, bw + 2, bh + 2);
  ctx.fillStyle = '#4a1010';
  ctx.fillRect(e.x - bw/2, by, bw, bh);
  const hpPct = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = e.isBoss ? '#ff3366' : (e.isStrong ? '#ff5555' : '#ff8888');
  ctx.fillRect(e.x - bw/2, by, bw * hpPct, bh);

  ctx.textAlign = 'left';
}

// ============================== 地图背景 ==============================
function drawBackground() {
  // 基础色块
  ctx.fillStyle = '#0c0d14';
  ctx.fillRect(0, 0, W, H);

  // 网格
  const gridSize = 60;
  const ox = -((state.camX % gridSize) + gridSize) % gridSize;
  const oy = -((state.camY % gridSize) + gridSize) % gridSize;
  ctx.strokeStyle = 'rgba(50,50,70,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = ox; x < W; x += gridSize) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = oy; y < H; y += gridSize) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // 大网格
  const gridSize2 = 300;
  const ox2 = -((state.camX % gridSize2) + gridSize2) % gridSize2;
  const oy2 = -((state.camY % gridSize2) + gridSize2) % gridSize2;
  ctx.strokeStyle = 'rgba(90,80,120,0.25)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let x = ox2; x < W; x += gridSize2) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = oy2; y < H; y += gridSize2) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // 散落的装饰(基于世界坐标hash,不变)
  drawDecorations();

  // 周围暗角
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.3, W/2, H/2, Math.max(W,H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawDecorations() {
  const cell = 200;
  const startX = Math.floor((state.camX - W/2) / cell);
  const startY = Math.floor((state.camY - H/2) / cell);
  const endX = Math.ceil((state.camX + W/2) / cell);
  const endY = Math.ceil((state.camY + H/2) / cell);
  for (let gx = startX; gx <= endX; gx++) {
    for (let gy = startY; gy <= endY; gy++) {
      // pseudo-random per cell
      const seed = gx * 928371 + gy * 12421 + 7;
      const r1 = fract(Math.sin(seed) * 43758.5453);
      if (r1 < 0.35) {
        const r2 = fract(Math.sin(seed * 1.3) * 12345.678);
        const r3 = fract(Math.sin(seed * 2.7) * 98765.432);
        const r4 = fract(Math.sin(seed * 3.9) * 5678.123);
        const wx = gx * cell + r2 * cell;
        const wy = gy * cell + r3 * cell;
        const sx = wx - state.camX + W/2;
        const sy = wy - state.camY + H/2;
        // 石头或裂纹
        if (r4 < 0.5) {
          // 石头
          ctx.fillStyle = 'rgba(60,58,70,0.5)';
          ctx.beginPath();
          ctx.ellipse(sx, sy, 8 + r4 * 14, 5 + r4 * 10, r4 * TAU, 0, TAU);
          ctx.fill();
          ctx.fillStyle = 'rgba(30,28,40,0.5)';
          ctx.beginPath();
          ctx.ellipse(sx + 2, sy + 2, 4 + r4 * 8, 2 + r4 * 5, 0, 0, TAU);
          ctx.fill();
        } else {
          // 裂纹
          ctx.strokeStyle = 'rgba(20,15,25,0.5)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + (r2 - 0.5) * 40, sy + (r3 - 0.5) * 40);
          ctx.lineTo(sx + (r2 - 0.5) * 60 + 10, sy + (r3 - 0.5) * 60 - 5);
          ctx.stroke();
        }
      }
    }
  }
}

function fract(x) { return x - Math.floor(x); }

// ============================== 游戏主循环 ==============================
let lastTime = 0;
function loop(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000 || 0);
  lastTime = t;
  if (state.running) {
    if (state.hitStopTime > 0) {
      state.hitStopTime -= dt;
    } else {
      update(dt);
    }
    render();
    updateUI();
  }
  requestAnimationFrame(loop);
}

function update(dt) {
  state.gameTime += dt;

  // 玩家输入
  const pl = state.player;
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len > 0) { dx /= len; dy /= len; }

  const accel = 0.22;
  pl.vx = lerp(pl.vx, dx * pl.speed, accel);
  pl.vy = lerp(pl.vy, dy * pl.speed, accel);
  pl.x += pl.vx * dt;
  pl.y += pl.vy * dt;

  if (len > 0) {
    pl.facing = angleLerp(pl.facing, Math.atan2(dy, dx), 0.2);
    pl.walkPhase += dt * 12;
  } else {
    pl.walkPhase *= 0.9;
  }

  if (pl.hitFlash > 0) pl.hitFlash -= dt;
  if (pl.damageImmune > 0) pl.damageImmune -= dt;

  // 相机 = 玩家位置
  state.camX = pl.x;
  state.camY = pl.y;

  // shake
  if (state.shakeTime > 0) {
    state.shakeTime -= dt;
    state.shakeAmt *= 0.9;
  } else state.shakeAmt = 0;

  // 更新玩家飞刀
  pl.knives.forEach(kn => updateKnife(kn, dt));

  // 更新敌人
  state.enemies.forEach(e => updateEnemy(e, dt));

  // 碰撞: 玩家飞刀 vs 敌人
  processPlayerKnivesHits();

  // 清理死亡敌人
  state.enemies = state.enemies.filter(e => {
    if (e.dead && (!e.deadTimer || (e.deadTimer -= dt) > 0)) {
      if (!e.deadTimer) e.deadTimer = 0.3;
      return false;
    }
    return !e.dead;
  });

  // 拾取物
  updatePickups(dt);

  // 特效更新
  updateParticles(dt);
  updateTrailPieces(dt);
  updateSparks(dt);
  updateExplosions(dt);
  updateFloatTexts(dt);

  // 威胁等级随时间+飞刀数上升
  state.threat = 1 + state.gameTime / 22 + pl.knives.length / 30;

  // 敌人生成
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    const base = Math.max(1.4, 3.5 - state.threat * 0.15);
    state.spawnTimer = rand(base * 0.7, base * 1.1);
    const maxEnemies = Math.floor(6 + state.threat * 1.8);
    if (state.enemies.length < maxEnemies && !state.bossActive) {
      const count = randI(1, Math.min(3, 1 + Math.floor(state.threat / 3)));
      for (let i = 0; i < count; i++) spawnEnemy(false);
    }
  }

  // 随机掉落在地图上
  state.pickupTimer -= dt;
  if (state.pickupTimer <= 0) {
    state.pickupTimer = rand(3, 6);
    const angle = Math.random() * TAU;
    const d = rand(300, 500);
    const x = pl.x + Math.cos(angle) * d;
    const y = pl.y + Math.sin(angle) * d;
    spawnPickup(x, y, rollKnifeByThreat(state.threat));
  }

  // BOSS
  state.bossTimer -= dt;
  if (state.bossTimer <= 0 && !state.bossActive) {
    state.bossActive = true;
    state.bossTimer = rand(45, 70);
    const boss = spawnEnemy(true);
    // BOSS 出现警示
    state.floatTexts.push({
      x: pl.x, y: pl.y - 80,
      vy: -20, life: 3, maxLife: 3,
      text: `⚠ ${boss.name} 现身 ⚠`,
      color: '#ff3366', size: 24, bold: true,
      glow: 'rgba(255,40,80,0.9)'
    });
  }

  // 远离玩家过远的敌人清理
  state.enemies = state.enemies.filter(e => {
    return dist2(e.x, e.y, pl.x, pl.y) < 1200 * 1200;
  });
  state.pickups = state.pickups.filter(p => dist2(p.x, p.y, pl.x, pl.y) < 1500 * 1500);
}

// ============================== 渲染 ==============================
function render() {
  // shake
  const sx = state.shakeAmt ? (Math.random() - 0.5) * state.shakeAmt : 0;
  const sy = state.shakeAmt ? (Math.random() - 0.5) * state.shakeAmt : 0;

  // background
  ctx.save();
  ctx.translate(sx, sy);
  drawBackground();
  ctx.restore();

  // world transform
  ctx.save();
  ctx.translate(W/2 + sx, H/2 + sy);
  ctx.translate(-state.camX, -state.camY);

  // pickups first (under)
  drawPickups();

  // trail pieces (底层)
  drawTrailPieces();

  // 敌人
  state.enemies.forEach(drawEnemy);
  // 敌人飞刀
  state.enemies.forEach(e => {
    e.knives.forEach(kn => drawKnife(ctx, kn));
  });

  // 玩家
  drawCharacter(ctx, state.player.x, state.player.y, state.player.facing, state.player.walkPhase, state.player.color, state.player.clothColor, 1.0, state.player.hitFlash);

  // 玩家飞刀
  state.player.knives.forEach(kn => drawKnife(ctx, kn));

  // 爆炸
  drawExplosions();

  // 粒子
  drawParticles();

  // 火花/闪电线
  drawSparksAndLines();

  // 飘字
  drawFloatTexts();

  ctx.restore();
}

function drawSparksAndLines() {
  state.sparks.forEach(s => {
    if (s.isLine) {
      const a = s.life / s.maxLife;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      // 闪电折线
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      const segs = 6;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const lx = lerp(s.x, s.x2, t) + (i > 0 && i < segs ? rand(-8, 8) : 0);
        const ly = lerp(s.y, s.y2, t) + (i > 0 && i < segs ? rand(-8, 8) : 0);
        if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
      }
      ctx.stroke();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }
  });
  drawSparks();
}

// ============================== UI 更新 ==============================
const hpBar = document.getElementById('hp-bar');
const hpText = document.getElementById('hp-text');
const knifeCount = document.getElementById('knife-count');
const statKills = document.getElementById('stat-kills');
const statTime = document.getElementById('stat-time');
const statThreat = document.getElementById('stat-threat');
const invList = document.getElementById('inv-list');

function updateUI() {
  const pl = state.player;
  const pct = clamp(pl.hp / pl.maxHp, 0, 1);
  hpBar.style.width = (pct * 100) + '%';
  hpText.textContent = `HP ${Math.ceil(pl.hp)} / ${pl.maxHp}`;
  knifeCount.textContent = `⚔ 飞刀数: ${pl.knives.length}`;
  statKills.textContent = state.kills;
  const t = Math.floor(state.gameTime);
  statTime.textContent = `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
  statThreat.textContent = state.threat.toFixed(1);

  // 库存: 按稀有度排序
  const entries = Object.entries(pl.knifeCounts).map(([id, c]) => ({
    type: KNIFE_TYPES[id], count: c
  }));
  const rarityOrder = ['legendary','epic','rare','uncommon','common'];
  entries.sort((a,b) => rarityOrder.indexOf(a.type.rarity) - rarityOrder.indexOf(b.type.rarity));
  invList.innerHTML = entries.map(e => {
    const col = RARITY[e.type.rarity].color;
    return `<div class="inv-item" style="color:${col}"><span class="inv-count">×${e.count}</span>${e.type.name}</div>`;
  }).join('');
}

// ============================== 开始 / 结束 ==============================
function startGame() {
  state.running = true;
  state.gameTime = 0;
  state.enemies = [];
  state.pickups = [];
  state.particles = [];
  state.floatTexts = [];
  state.sparks = [];
  state.explosions = [];
  state.trailPieces = [];
  state.kills = 0;
  state.threat = 1;
  state.spawnTimer = 2;
  state.pickupTimer = 3;
  state.bossTimer = 35;
  state.bossActive = false;
  state.shakeAmt = 0;
  state.shakeTime = 0;
  state.hitStopTime = 0;

  state.player = createPlayer();
  // 给 5 把初始刀
  for (let i = 0; i < 5; i++) {
    addKnifeToPlayer(0); // 铁制飞刀
  }

  document.getElementById('game-over').classList.remove('show');
  document.getElementById('title-screen').style.display = 'none';
}

function gameOver() {
  state.running = false;
  const t = Math.floor(state.gameTime);
  const totalKnives = state.player.knives.length;
  // 稀有度统计
  const byR = { common:0, uncommon:0, rare:0, epic:0, legendary:0 };
  Object.entries(state.player.knifeCounts).forEach(([id, c]) => {
    byR[KNIFE_TYPES[id].rarity] += c;
  });
  document.getElementById('final-stats').innerHTML = `
    <div>存活时间: <span class="hl">${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}</span></div>
    <div>击杀敌人: <span class="hl">${state.kills}</span></div>
    <div>最终飞刀: <span class="hl">${totalKnives}</span> 把</div>
    <div>威胁等级: <span class="hl">${state.threat.toFixed(1)}</span></div>
    <div style="margin-top:12px;font-size:14px;">
      <span style="color:${RARITY.legendary.color}">传说 ${byR.legendary}</span> ·
      <span style="color:${RARITY.epic.color}">史诗 ${byR.epic}</span> ·
      <span style="color:${RARITY.rare.color}">稀有 ${byR.rare}</span> ·
      <span style="color:${RARITY.uncommon.color}">优秀 ${byR.uncommon}</span> ·
      <span style="color:${RARITY.common.color}">普通 ${byR.common}</span>
    </div>
  `;
  document.getElementById('game-over').classList.add('show');
}

document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('start-btn').addEventListener('click', startGame);

// 启动循环
requestAnimationFrame(loop);

</script>
